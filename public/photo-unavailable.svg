<!--
  Shown in place of a photograph that will not load.

  Local, so it works when the network does not and cannot itself 404 - which is
  the whole point of a fallback. Brand colours rather than a grey box, and it
  deliberately does not look like a broken file: an image that failed is a small
  disappointment, an image that looks broken reads as a broken site.

  No text, so it needs no translation and no RTL handling; the alt attribute at
  the call site carries the meaning.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" width="160" height="120" role="img" aria-hidden="true">
  <rect width="160" height="120" fill="#f3ece0" />
  <g fill="none" stroke="#0f0e1a" stroke-opacity="0.22" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <rect x="30" y="30" width="100" height="62" rx="8" />
    <path d="M30 76l22-20 18 16 16-14 24 22" />
  </g>
  <circle cx="58" cy="50" r="6" fill="#0f0e1a" fill-opacity="0.18" />
  <path d="M112 22l6 12 12 6-12 6-6 12-6-12-12-6 12-6z" fill="#ff6b4a" fill-opacity="0.35" />
</svg>
